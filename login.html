<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Concentrix</title>
    <link rel="icon" type="image/png" href="assets/favicon.png?v=1.1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 900: '#0f172a', 800: '#1e293b' },
                        indigo: { 600: '#4f46e5', 700: '#4338ca' }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-6 relative font-sans">
    <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-indigo-600/10 to-transparent -z-10 pointer-events-none"></div>

    <div class="glass w-full max-w-5xl rounded-[3rem] overflow-hidden shadow-2xl border border-white flex flex-col md:flex-row min-h-[600px]">
        <!-- Left Column: Branding -->
        <div class="w-full md:w-5/12 bg-white p-12 text-slate-900 flex flex-col justify-center relative overflow-hidden border-r border-slate-100">
            <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-slate-50 to-transparent"></div>
            <div class="relative z-10 text-center md:text-left">
                <div class="h-24 flex items-center justify-center md:justify-start mb-10">
                    <img src="assets/logo.png?v=1.1" alt="Logo" class="h-full object-contain">
                </div>
                <h1 class="text-4xl font-black tracking-tight mb-4">System Access</h1>
                <p id="loginSubtitle" class="text-slate-500 text-lg font-medium leading-relaxed">Welcome back to Concentrix. Please authenticate to access your portal.</p>

                <div class="mt-12 pt-12 border-t border-slate-100 hidden md:block">
                    <div class="flex items-center gap-4 text-slate-400">
                        <div class="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 00-2 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                        </div>
                        <p class="text-sm font-bold">Secure Authentication</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Authentication -->
        <div class="w-full md:w-7/12 p-12 flex flex-col justify-center bg-white/50 relative">
            <!-- Auth Type Toggle -->


            <!-- Password Login Section -->
            <div id="passwordSection" class="space-y-6 animate-in fade-in slide-in-from-bottom-2 duration-300">
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="username" class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-2 block ml-2">Username</label>
                        <input type="text" id="username" name="username" required placeholder="Enter username"
                            class="w-full px-6 py-4 rounded-2xl border-2 border-slate-100 focus:border-indigo-500 outline-none transition-all font-bold bg-white">
                    </div>

                    <div class="relative group">
                        <label for="password" class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-2 block ml-2">Password</label>
                        <div class="relative">
                            <input type="password" id="password" name="password" required placeholder="••••••••"
                                class="w-full px-6 py-4 rounded-2xl border-2 border-slate-100 focus:border-indigo-500 outline-none transition-all font-bold bg-white pr-14">
                            <button type="button" id="togglePassword" class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-300 hover:text-indigo-600 transition-colors p-2">
                                <svg id="eyeIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="loginBtn" class="w-full py-5 bg-indigo-600 hover:bg-black text-white rounded-2xl font-black uppercase tracking-widest transition-all shadow-xl shadow-indigo-600/20">
                        Sign In
                    </button>
                </form>
            </div>

            <div id="statusMessage" class="hidden mt-8 p-4 rounded-2xl text-xs font-black text-center uppercase tracking-widest transition-all border"></div>
        </div>
    </div>

    <script>
        const passwordSection = document.getElementById('passwordSection');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const status = document.getElementById('statusMessage');

        // Password Toggle
        togglePassword.addEventListener('click', () => {
            const isPass = passwordInput.type === 'password';
            passwordInput.type = isPass ? 'text' : 'password';
            eyeIcon.innerHTML = isPass
                ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L5.136 5.136m13.728 13.728L14.122 14.122M17.657 17.657a10.05 10.05 0 001.886-2.657M21.458 12c-1.274-4.057-5.064-7-9.542-7-1.273 0-2.483.235-3.597.666M3 3l18 18" />`
                : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
        });

        function showStatus(msg, type = 'error') {
            status.textContent = msg;
            status.className = `mt-8 p-4 rounded-2xl text-[10px] font-black text-center uppercase tracking-[0.2em] transition-all block `;
            if (type === 'success') {
                status.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-100');
            } else {
                status.classList.add('bg-rose-50', 'text-rose-700', 'border-rose-100');
            }
            status.classList.remove('hidden');
        }

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Verifying...';
            status.classList.add('hidden');

            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('backend/auth.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.status === 'success') {
                    if (data.serial_number) {
                        localStorage.setItem('serial_number', data.serial_number);
                    }
                    showStatus('Welcome! Redirecting...', 'success');
                    setTimeout(() => window.location.href = data.redirect, 1000);
                } else {
                    throw new Error(data.message);
                }
            } catch (err) {
                showStatus(err.message || 'Authentication failed.');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });


    </script>
</body>

</html>
